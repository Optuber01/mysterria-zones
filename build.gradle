plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id('com.gradleup.shadow') version '9.4.1'
}

group = 'net.mysterria.zones'
version = '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    maven { url "https://repo.panda-lang.org/releases" }

    maven {
        url = "https://nexus.mysterria.net/repository/plugin-public/"
    }
}

tasks.build.dependsOn tasks.shadowJar

dependencies {
    implementation "dev.rollczi:litecommands-bukkit:3.10.2"
    def coiApiJar = project.findProperty('coiApiJar')
    if (coiApiJar) {
        compileOnly files(coiApiJar)
    } else {
        compileOnly("dev.ua.ikeepcalm:circle-of-imagination-api:1.4.8-SNAPSHOT")
    }
    implementation 'dev.ua.ikeepcalm.mysterria:audit-client:1.0.0'
    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'dev.ua.ikeepcalm.mysterria.audit', 'net.mysterria.zones.libs.audit'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks {
    runServer {
        minecraftVersion("1.21.4")
    }
}
